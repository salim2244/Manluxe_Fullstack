<div class="min-h-screen flex">

  <!-- Left panel — decorative -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-primary overflow-hidden">
    <img src="/images/hero-fashion.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40">
    <div class="absolute inset-0 bg-gradient-to-br from-primary/90 to-secondary/60"></div>
    <div class="relative flex flex-col justify-between p-12 text-white">
      <a routerLink="/" class="text-2xl font-display font-bold">
        LUXE<span class="text-accent">WEAR</span>
      </a>
      <div>
        <h2 class="text-4xl font-display font-bold leading-tight mb-4">
          Style is a way<br>to say who you are<br>without speaking.
        </h2>
        <p class="text-white/60 text-sm">— Rachel Zoe</p>
      </div>
      <div class="flex gap-4 text-sm text-white/50">
        <span>Men's</span><span>·</span><span>Women's</span><span>·</span><span>Trending</span>
      </div>
    </div>
  </div>

  <!-- Right panel — form -->
  <div class="flex-1 flex items-center justify-center p-6 bg-gray-50">
    <div class="w-full max-w-md">

      <!-- Mobile logo -->
      <div class="lg:hidden text-center mb-8">
        <a routerLink="/" class="text-3xl font-display font-bold text-primary">
          LUXE<span class="text-secondary">WEAR</span>
        </a>
      </div>

      <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10">

        <h1 class="text-2xl font-display font-bold text-primary mb-1">Welcome back 👋</h1>
        <p class="text-gray-400 text-sm mb-8">Sign in to your account to continue</p>

        <form (ngSubmit)="submit()" #f="ngForm">

          <div class="mb-5">
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Email</label>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              class="input-field"
              placeholder="you@example.com"
              autocomplete="email">
          </div>

          <div class="mb-6">
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Password</label>
              <button type="button" class="text-xs text-secondary hover:underline">Forgot password?</button>
            </div>
            <div class="relative">
              <input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                class="input-field pr-10"
                placeholder="••••••••"
                autocomplete="current-password">
              <button type="button"
                (click)="showPassword = !showPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm">
                {{ showPassword ? '🙈' : '👁️' }}
              </button>
            </div>
          </div>

          @if (error) {
            <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm
                        rounded-xl px-4 py-3 mb-4 animate-shake">
              <span class="shrink-0 text-base">⚠️</span>
              <span>{{ error }}</span>
            </div>
          }

          <button
            type="submit"
            [disabled]="loading"
            class="w-full btn-primary py-3.5 text-base mb-4 disabled:opacity-60
                   flex items-center justify-center gap-2">
            @if (loading) {
              <span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
              <span>Signing in...</span>
            } @else {
              <span>Sign In →</span>
            }
          </button>

        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-5">
          <div class="flex-1 h-px bg-gray-100"></div>
          <span class="text-xs text-gray-400">or</span>
          <div class="flex-1 h-px bg-gray-100"></div>
        </div>

        <!-- Social -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button class="flex items-center justify-center gap-2 border border-gray-200 rounded-xl py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all">
            <span class="font-bold text-blue-600">G</span> Google
          </button>
          <button class="flex items-center justify-center gap-2 border border-gray-200 rounded-xl py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all">
            <span class="font-bold text-blue-800">f</span> Facebook
          </button>
        </div>

        <p class="text-center text-sm text-gray-500">
          Don't have an account?
          <a routerLink="/signup" class="text-secondary font-semibold hover:underline ml-1">Sign up free</a>
        </p>

      </div>

      <p class="text-center text-xs text-gray-400 mt-6">
        <a routerLink="/" class="hover:text-secondary transition-colors">← Back to store</a>
      </p>
    </div>
  </div>
</div>
